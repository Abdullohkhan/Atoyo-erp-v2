name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atoyo
          POSTGRES_PASSWORD: atoyo
          POSTGRES_DB: atoyo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atoyo" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -w backend
      - run: npm test -w backend
      - run: npm run build -w backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -w frontend
      - run: npm test -w frontend
      - run: npm run build -w frontend
